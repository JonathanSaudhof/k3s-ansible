# Pangolin (https://github.com/fosrl/helm-charts)
# Repo: https://charts.fossorial.io  Chart: fossorial/pangolin  Version: 0.1.0-alpha.1 (Pangolin 1.18.3)
# The chart is a pre-release: pin the version and run `helm template` before upgrading.
#
# Controller mode: pangolin-kube-controller turns Pangolin's routing config into Traefik IngressRoutes
# for k3s' bundled Traefik (kube-system), whose "letsencrypt" resolver comes from the HelmChartConfig in
# ../cloud-init.yaml.tftpl. The CNPG operator is installed separately (make hetzner-install-cnpg)
# because its CRDs must exist before this release renders the Cluster.
#
# Set by the Makefile: gerbil.startupMode and the controller's API egress CIDR (the node's public IP).

deployment:
  type: controller
  mode: multi
  installTraefikController: false
  traefikNamespace: kube-system

global:
  storageClass: local-path

pangolin:
  secret:
    existingSecretName: pangolin-app-secret
    existingSecretKey: SERVER_SECRET
  config:
    app:
      dashboard_url: "https://pangolin.ez-lab.de"
      log_level: info
    domains:
      domain1:
        base_domain: "ez-lab.de"
        cert_resolver: "letsencrypt"
    gerbil:
      base_endpoint: "pangolin.ez-lab.de"
      start_port: 51820
      clients_start_port: 21820
    traefik:
      enabled: true
      http_entrypoint: web
      https_entrypoint: websecure
      cert_resolver: letsencrypt
  ingressRoute:
    dashboard:
      enabled: true
      tls:
        certResolver: letsencrypt

controller:
  enabled: true

gerbil:
  enabled: true
  persistence:
    enabled: true
    size: 1Gi
  # k3s ServiceLB binds these on the node; the Hetzner firewall opens both UDP ports.
  # The internal API (3004) is left out so it isn't published on the host.
  service:
    type: LoadBalancer
    ports:
      - name: wg1
        port: 51820
        targetPort: wg1
        protocol: UDP
      - name: wg2
        port: 21820
        targetPort: wg2
        protocol: UDP

database:
  mode: cloudnativepg
  cloudnativepg:
    cluster:
      name: pangolin-db

cnpg-operator:
  enabled: false

cnpg-cluster:
  enabled: true
  fullnameOverride: pangolin-db
  cluster:
    instances: 1
    storage:
      size: 5Gi
      storageClass: local-path
